name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF extraction and fixture libraries
        run: python -m pip install -e '.[research]' 'reportlab>=4,<5'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check code and deployment script syntax
        run: |
          python -m compileall -q marketsignal
          bash -n scripts/deploy_gcp.sh
          bash -n scripts/enable_schedule_gcp.sh
      - name: Exercise synthetic replay
        run: python -m marketsignal demo --db demo/demo.db --out demo/index.html
      - name: Enforce offline agent process and result quality gates
        run: python -m marketsignal evaluate-agents --cases 120
      - name: Exercise evidence-bound newspaper writing and quote verification
        run: python -m marketsignal feature-demo > feature-demo-shadow.json
      - name: Exercise newsroom v3 full fictional handoff and fail-closed release
        run: python -m marketsignal newsroom-v3-demo > newsroom-v3-shadow.json
      - name: Validate a synthetic field-trial fixture without article publication
        run: |
          python -m marketsignal field-trial \
            --case tests/fixtures/fictional_field_trial.json \
            --out reports/fictional-shadow.md > field-trial-audit.json
      - name: Exercise replayed investigator-verifier-editor-writer shadow loop
        run: |
          python -m marketsignal shadow-loop \
            --mode replay \
            --case tests/fixtures/fictional_field_trial.json \
            --out reports/editorial-loop-fictional.md \
            --trace reports/editorial-loop-fictional.json
      - name: Probe free public research endpoints (diagnostic only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: python -m marketsignal source-smoke --archive-dir data/archive
      - name: Probe official pilot sources without models or stored content
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        continue-on-error: true
        run: python -m scripts.probe_pilot_sources > pilot-source-readiness.json
      - name: Diagnose alternative news discovery with no model expense
        if: github.event_name == 'pull_request'
        timeout-minutes: 1
        continue-on-error: true
        run: python -m scripts.probe_news_search
      - name: Retain sanitized pilot source readiness for seven days
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pilot-source-readiness
          path: pilot-source-readiness.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Build production container
        run: docker build --tag marketsignal:ci .
